<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; padding:0; background:#0a0f1e; font-family: 'Segoe UI', Arial, sans-serif; }
  .wrapper { max-width:600px; margin:0 auto; padding:32px 16px; }
  .card { background:#0f1e37; border:1px solid rgba(72,187,255,0.25); border-radius:16px; overflow:hidden; }
  .header { background:linear-gradient(135deg,#0d2a4a,#1a1040); padding:28px 32px; text-align:center; }
  .header h1 { margin:0; font-size:22px; color:#48bbff; letter-spacing:.5px; }
  .header p { margin:6px 0 0; font-size:13px; color:#64748b; }
  .body { padding:28px 32px; }
  .body p { color:#cbd5e1; font-size:15px; line-height:1.7; margin:0 0 16px; }
  .body strong { color:#e2e8f0; }
  .highlight-box { background:rgba(72,187,255,0.06); border:1px solid rgba(72,187,255,0.2); border-radius:10px; padding:16px 20px; margin:20px 0; }
  .highlight-box p { margin:6px 0; font-size:14px; color:#94a3b8; }
  .highlight-box .label { color:#64748b; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .highlight-box .value { color:#e2e8f0; font-weight:600; font-size:15px; }
  .btn { display:inline-block; padding:12px 28px; background:linear-gradient(135deg,#48bbff,#a855f7); color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; margin:8px 0; }
  .footer { padding:20px 32px; border-top:1px solid rgba(255,255,255,0.06); text-align:center; }
  .footer p { margin:0; font-size:12px; color:#475569; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header">
      <h1>🧠 AI Talent Match</h1>
      <p>Intelligent University Recruitment Platform</p>
    </div>
    {% block content %}{% endblock %}
    <div class="footer">
      <p>© 2026 AI Talent Match · This is an automated notification · <a href="{{ dashboard_url }}" style="color:#48bbff;">Open Dashboard</a></p>
    </div>
  </div>
</div>
</body>
</html>
